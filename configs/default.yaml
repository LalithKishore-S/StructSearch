# StructSearch default configuration.
# Tune weights on dev queries only. Weights of --mode text_ast. A missing signal (no graph score,
# no structural wording in the query) is dropped and the remaining weights are renormalized (Step 6).
corpus_path: tests/fixtures/sample_corpus
index_dir: .structsearch_index
top_k: 10

weights:
  text: 0.6
  structural: 0.3
  graph: 0.1

# Weights for --mode hybrid (BM25 + dense + structural [+ graph]). A signal that is missing or carries
# no information for a query (e.g. a query without structural wording) is dropped and the rest are
# rescaled to sum to 1, so these are relative importances, not absolute shares.
hybrid_weights:
  text: 0.4
  dense: 0.3
  structural: 0.2
  graph: 0.1

# BM25 text index (Step 2). Field weights multiply each field's BM25 score.
bm25:
  k1: 1.5
  b: 0.75
  field_weights:
    name: 3.0
    identifiers: 2.0
    doc: 1.5
    code: 1.0

# Dense semantic baseline (Step 3b). Embeddings come from a local Ollama server.
# nomic-embed-text expects the two task prefixes; for another model, set both to "".
# backend "hashing" is a lexical stand-in for tests and offline demos, NOT semantic.
dense:
  backend: ollama
  model: nomic-embed-text
  host: http://localhost:11434
  doc_prefix: "search_document: "
  query_prefix: "search_query: "
  max_chars: 4000
  batch_size: 16
  timeout_seconds: 120

# Optional local LLM (off by default; every LLM path has a rule-based fallback).
llm:
  enabled: false
  backend: ollama
  host: http://localhost:11434
  model: qwen2.5-coder:7b
  fallback_model: qwen2.5-coder:3b
  timeout_seconds: 60
